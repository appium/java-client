      oldFullyQualifiedTypeName: org.openqa.selenium.remote.SessionId
      newFullyQualifiedTypeName: io.appium.java_client.remote.SessionId
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.Response
      newFullyQualifiedTypeName: io.appium.java_client.remote.Response
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.Command
      newFullyQualifiedTypeName: io.appium.java_client.remote.Command
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.CommandPayload
      newFullyQualifiedTypeName: io.appium.java_client.remote.CommandPayload
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.DriverCommand
      newFullyQualifiedTypeName: io.appium.java_client.remote.DriverCommand
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.ExecuteMethod
      newFullyQualifiedTypeName: io.appium.java_client.remote.ExecuteMethod
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.CommandExecutor
      newFullyQualifiedTypeName: io.appium.java_client.remote.CommandExecutor
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.ErrorHandler
      newFullyQualifiedTypeName: io.appium.java_client.remote.ErrorHandler
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.ErrorCodes
      newFullyQualifiedTypeName: io.appium.java_client.remote.ErrorCodes
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.ScreenshotException
      newFullyQualifiedTypeName: io.appium.java_client.remote.ScreenshotException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.UnreachableBrowserException
      newFullyQualifiedTypeName: io.appium.java_client.remote.UnreachableBrowserException
