# OpenRewrite recipes for the Appium Java client v10 -> v11 migration.
# See docs/v10-to-v11-migration-guide.md for how to run them.
---
type: specs.openrewrite.org/v1beta/recipe
name: io.appium.java_client.MigrateToV11
displayName: Migrate to Appium Java client 11
description: >
  Moves the types that the Appium Java client took over from selenium-remote-driver and selenium-http
  to the Appium packages. Run it with the v10 client still on the classpath, then upgrade the dependency.
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.RemoteWebElement
      newFullyQualifiedTypeName: io.appium.java_client.remote.AppiumWebElement
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.HttpCommandExecutor
      newFullyQualifiedTypeName: io.appium.java_client.remote.AppiumCommandExecutor
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.CommandInfo
      newFullyQualifiedTypeName: io.appium.java_client.AppiumCommandInfo
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.appium.java_client.functions.ExpectedCondition
      newFullyQualifiedTypeName: org.openqa.selenium.support.ui.ExpectedCondition
  - io.appium.java_client.MigrateToV11RemoteTypes
  - io.appium.java_client.MigrateToV11HttpTypes
  - io.appium.java_client.MigrateToV11PageFactoryEngine
---
