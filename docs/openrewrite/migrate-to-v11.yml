type: specs.openrewrite.org/v1beta/recipe
name: io.appium.java_client.MigrateToV11PageFactoryEngine
displayName: Move the page factory extension points to io.appium.java_client.support
description: >
  The types that custom element locators and decorators extend or implement, and the PageFactory
  that accepts the Appium field decorators.
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.PageFactory
      newFullyQualifiedTypeName: io.appium.java_client.support.PageFactory
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.pagefactory.ElementLocator
      newFullyQualifiedTypeName: io.appium.java_client.support.pagefactory.ElementLocator
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.pagefactory.ElementLocatorFactory
      newFullyQualifiedTypeName: io.appium.java_client.support.pagefactory.ElementLocatorFactory
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.pagefactory.FieldDecorator
      newFullyQualifiedTypeName: io.appium.java_client.support.pagefactory.FieldDecorator
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.pagefactory.DefaultFieldDecorator
      newFullyQualifiedTypeName: io.appium.java_client.support.pagefactory.DefaultFieldDecorator
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.pagefactory.AbstractAnnotations
      newFullyQualifiedTypeName: io.appium.java_client.support.pagefactory.AbstractAnnotations
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.pagefactory.ByAll
      newFullyQualifiedTypeName: io.appium.java_client.support.pagefactory.ByAll
---
type: specs.openrewrite.org/v1beta/recipe
name: io.appium.java_client.MigrateToV11PageObjectAnnotations
displayName: Use the Appium page object annotations
description: >
  Optional. The Selenium annotations keep working with the Appium decorators while selenium-support is
  available, but they are not seen by the Selenium PageFactory once replaced. Do not run it on the code
  that also initializes page objects with the Selenium PageFactory.
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.FindBy
      newFullyQualifiedTypeName: io.appium.java_client.support.FindBy
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.FindBys
      newFullyQualifiedTypeName: io.appium.java_client.support.FindBys
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.FindAll
      newFullyQualifiedTypeName: io.appium.java_client.support.FindAll
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.CacheLookup
      newFullyQualifiedTypeName: io.appium.java_client.support.CacheLookup
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.support.How
      newFullyQualifiedTypeName: io.appium.java_client.support.How
---
type: specs.openrewrite.org/v1beta/recipe
name: io.appium.java_client.FindV11Breakages
displayName: Mark the code that needs a manual change for Appium Java client 11
description: >
  Marks the usages of the types that have no automatic replacement with a /*~~> comment.
  Run it with the v10 client still on the classpath and search for the markers afterwards.
recipeList:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: org.openqa.selenium.remote.RemoteWebDriver
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: org.openqa.selenium.bidi.HasBiDi
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: org.openqa.selenium.bidi.BiDi
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.TouchAction
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.MultiTouchAction
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.PerformsTouchActions
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.android.AndroidTouchAction
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.ios.IOSTouchAction
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.touch..*
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.ios.touch..*
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: org.openqa.selenium.remote.service.DriverService
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.remote.AppiumProtocolHandshake
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.functions.ActionSupplier
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.functions.AppiumFunction
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.android.AndroidMobileCommandHelper
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.ios.IOSMobileCommandHelper
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: io.appium.java_client.CanRememberExtensionPresence
